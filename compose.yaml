x-app: &app
  build:
    context: ./backend
    dockerfile: ../docker/php/Dockerfile
  image: reservehub-app:dev
  pull_policy: build
  volumes:
    - ./backend:/var/www/html
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}    # ←
    DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}    # ←
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}    # ←
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    user: www-data
    restart: unless-stopped
    stop_grace_period: 60s

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:80"                     # ←
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:                                              # ←
      app:
        condition: service_started
        restart: true

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}        # ←
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}      # ←
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}  # ←
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5433}:5432"            # ←
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]   # ←
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6380}:6379"         # ←
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data: